name: Feature request
description: Suggest an improvement to the standalone client.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives considered.
    validations:
      required: true
