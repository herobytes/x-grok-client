name: Merge XClientTransaction updates

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merge-transaction-updates
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use only GitHub API metadata. Never check out or execute PR code.
      - name: Merge eligible dependency updates
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const candidates = context.payload.pull_request
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', base: 'main', per_page: 100,
                });

            // Accept stable release versions, including post releases.
            const requirement = /^xclienttransaction\s*>=\s*(\d+(?:\.\d+)*)(?:\.post(\d+))?\s*$/i;
            const newer = (before, after) => {
              const oldParts = before[1].split('.').map(BigInt);
              const newParts = after[1].split('.').map(BigInt);
              for (let i = 0; i < Math.max(oldParts.length, newParts.length); i++) {
                const oldPart = oldParts[i] ?? 0n;
                const newPart = newParts[i] ?? 0n;
                if (oldPart !== newPart) return newPart > oldPart;
              }
              return BigInt(after[2] ?? -1) > BigInt(before[2] ?? -1);
            };

            for (const candidate of candidates) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: candidate.number,
              });
              if (pr.state !== 'open' || pr.draft || pr.user.login !== 'dependabot[bot]' ||
                  pr.base.ref !== 'main' || pr.head.repo?.full_name !== `${owner}/${repo}` ||
                  !pr.head.ref.startsWith('dependabot/pip/')) continue;

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const file = files[0];
              if (files.length !== 1 || file.filename !== 'requirements.txt' ||
                  file.status !== 'modified' || file.additions !== 1 ||
                  file.deletions !== 1 || !file.patch) {
                core.info(`Skipping #${pr.number}: changes exceed the allowed dependency line.`);
                continue;
              }
              const lines = file.patch.split('\n');
              const removed = lines.filter(line => line.startsWith('-'));
              const added = lines.filter(line => line.startsWith('+'));
              const before = removed.length === 1 && requirement.exec(removed[0].slice(1));
              const after = added.length === 1 && requirement.exec(added[0].slice(1));
              if (!before || !after || !newer(before, after)) {
                core.info(`Skipping #${pr.number}: not a stable XClientTransaction version increase.`);
                continue;
              }

              // Bind the merge to the inspected revision and honor branch rules.
              const { data: result } = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, sha: pr.head.sha,
                merge_method: 'squash',
              });
              if (!result.merged) {
                core.setFailed(`Could not merge #${pr.number}: ${result.message}`);
              } else {
                core.info(`Merged #${pr.number} at ${result.sha}.`);
              }
            }
